openapi: 3.0.3
info:
  title: API Security Example (DWES)
  version: "1.2.0"
  description: >
    API educativa con Spring Boot, JWT y control de acceso por roles (ROLE_USER, ROLE_ADMIN).
    Spec alineado con los DTOs reales del backend:
    - SignUpRequest       : firstName, lastName, email, password
    - SigninRequest       : email, password
    - UsuarioResponse    : firstName, lastName, email, rol (string singular)
    - ErrorDetailsResponse: timestamp, message, details
    - POST /auth/signup  -> 200 + JWT
    - POST /videojuegos  -> 200 + Videojuego
    - DELETE /videojuegos/{id}-> 200 sin body

servers:
  - url: http://localhost:9091
    description: Local

tags:
  - name: Auth
    description: Autenticación y registro de usuarios
  - name: Videojuegos
    description: CRUD de videojuegos — lectura requiere USER/ADMIN, escritura requiere ADMIN
  - name: Users
    description: Gestión/listado de usuarios (solo ADMIN)
  - name: Resources
    description: Recurso protegido de ejemplo

# ──────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ──────────────────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Error ──────────────────────────────────────────────────────────────────
    # Refleja exactamente: ErrorDetailsResponse(Date timestamp, String message, String details)
    ErrorDetailsResponse:
      type: object
      required: [timestamp, message, details]
      properties:
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora del error (java.util.Date serializado como ISO-8601)
          example: "2026-02-19T18:20:30.123+00:00"
        message:
          type: string
          description: Descripción corta del error
          example: "Unauthorized"
        details:
          type: string
          description: Información adicional, normalmente la URI de la petición
          example: "uri=/api/v1/videojuegos"

    # ── Auth ───────────────────────────────────────────────────────────────────
    SigninRequest:
      type: object
      description: Credenciales para obtener un JWT.
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice.johnson@example.com
        password:
          type: string
          example: password123

    SignUpRequest:
      type: object
      description: Datos de registro de un nuevo usuario. El backend asigna ROLE_USER por defecto.
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          example: Alice
        lastName:
          type: string
          example: Johnson
        email:
          type: string
          format: email
          example: alice.johnson@example.com
        password:
          type: string
          example: password123

    JwtAuthenticationResponse:
      type: object
      description: Respuesta devuelta en signin y signup con el JWT generado.
      required: [token]
      properties:
        token:
          type: string
          description: JWT Bearer token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhbGljZS5qb2huc29uQGV4YW1wbGUuY29tIiwicm9sZXMiOlsiUk9MRV9VU0VSIl0sImlhdCI6MTcwODM2OTQwMCwiZXhwIjoxNzA4MzczMDAwfQ.signature"

    # ── Videojuegos ───────────────────────────────────────────────────────────
    Videojuego:
      type: object
      description: Videojuego persistido devuelto por el servidor. El id lo asigna el servidor.
      required: [id, nombre, desarrollador, esOnline]
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1
        nombre:
          type: string
          example: Elden Ring
        desarrollador:
          type: string
          example: FromSoftware
        esOnline:
          type: boolean
          description: Indica si el juego tiene componentes online
          example: true

    VideojuegoWriteRequest:
      type: object
      description: >
        Cuerpo para crear (POST) o actualizar (PUT) un videojuego.
        El id no se incluye; en PUT se obtiene del path.
      required: [nombre, desarrollador, esOnline]
      properties:
        nombre:
          type: string
          example: Elden Ring
        desarrollador:
          type: string
          example: FromSoftware
        esOnline:
          type: boolean
          example: true

    # ── Spring Data Page ───────────────────────────────────────────────────────
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean

    PageableObject:
      type: object
      properties:
        pageNumber:
          type: integer
        pageSize:
          type: integer
        offset:
          type: integer
          format: int64
        paged:
          type: boolean
        unpaged:
          type: boolean
        sort:
          $ref: "#/components/schemas/SortObject"

    PageVideojuego:
      type: object
      description: Respuesta paginada de Spring Data (Page<Videojuego>).
      required:
        [content, number, size, totalElements, totalPages, first, last, empty]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/Videojuego"
        pageable:
          $ref: "#/components/schemas/PageableObject"
        sort:
          $ref: "#/components/schemas/SortObject"
        number:
          type: integer
          description: Página actual (0-based)
          example: 0
        size:
          type: integer
          example: 10
        numberOfElements:
          type: integer
          example: 10
        totalElements:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          example: 5
        first:
          type: boolean
          example: true
        last:
          type: boolean
          example: false
        empty:
          type: boolean
          example: false

    # ── Users ──────────────────────────────────────────────────────────────────
    # Refleja exactamente: UsuarioResponse(String firstName, String lastName, String email, String rol)
    UsuarioResponse:
      type: object
      required: [firstName, lastName, email, rol]
      properties:
        firstName:
          type: string
          example: Alice
        lastName:
          type: string
          example: Johnson
        email:
          type: string
          format: email
          example: alice.johnson@example.com
        rol:
          type: string
          description: Rol asignado al usuario (campo singular string, no array)
          example: ROLE_USER

# ──────────────────────────────────────────────────────────────────────────────
# PATHS
# ──────────────────────────────────────────────────────────────────────────────
paths:
  # ── AUTH ───────────────────────────────────────────────────────────────────
  /api/v1/auth/signin:
    post:
      tags: [Auth]
      summary: Login — obtención de JWT
      operationId: signin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninRequest"
      responses:
        "200":
          description: JWT generado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtAuthenticationResponse"
        "400":
          description: JSON malformado o campos requeridos ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"

  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: Registro de nuevo usuario
      operationId: signup
      description: >
        Crea un usuario con ROLE_USER y devuelve un JWT directamente.
        El email debe ser único; si ya existe se devuelve 400.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "200":
          description: Usuario registrado — devuelve JWT (comportamiento actual del backend)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtAuthenticationResponse"
        "400":
          description: >
            Petición inválida: JSON malformado, campos requeridos ausentes o email ya registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"

  # ── VIDEOJUEGOS (colección) ────────────────────────────────────────────────
  /api/v1/videojuegos:
    get:
      tags: [Videojuegos]
      summary: Listado paginado de videojuegos
      operationId: listVideojuegos
      description: Requiere ROLE_USER o ROLE_ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          description: Número de página (0-based)
          schema:
            type: integer
            default: 0
            minimum: 0
        - in: query
          name: size
          description: Elementos por página.
          schema:
            type: integer
            default: 10
            minimum: 1
      responses:
        "200":
          description: Página de videojuegos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageVideojuego"
        "401":
          description: Token ausente o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "403":
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"

    post:
      tags: [Videojuegos]
      summary: Crear videojuego
      operationId: createVideojuego
      description: Requiere ROLE_ADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideojuegoWriteRequest"
      responses:
        "200":
          description: Videojuego creado (comportamiento actual del backend)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Videojuego"
        "400":
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "401":
          description: Token ausente o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "403":
          description: Sin permisos — se requiere ROLE_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"

  # ── VIDEOJUEGOS (recurso individual) ───────────────────────────────────────
  /api/v1/videojuegos/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: ID del videojuego
        schema:
          type: integer
          format: int64
          minimum: 1
          example: 1

    get:
      tags: [Videojuegos]
      summary: Obtener videojuego por ID
      operationId: getVideojuegoById
      description: Requiere ROLE_USER o ROLE_ADMIN.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Videojuego encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Videojuego"
        "401":
          description: Token ausente o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "403":
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "404":
          description: Videojuego no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"

    put:
      tags: [Videojuegos]
      summary: Actualizar videojuego
      operationId: updateVideojuego
      description: Requiere ROLE_ADMIN. Reemplaza todos los campos del videojuego.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideojuegoWriteRequest"
      responses:
        "200":
          description: Videojuego actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Videojuego"
        "400":
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "401":
          description: Token ausente o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "403":
          description: Sin permisos — se requiere ROLE_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "404":
          description: Videojuego no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"

    delete:
      tags: [Videojuegos]
      summary: Eliminar videojuego
      operationId: deleteVideojuego
      description: Requiere ROLE_ADMIN.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Videojuego eliminado (comportamiento actual del backend — sin body)
        "401":
          description: Token ausente o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "403":
          description: Sin permisos — se requiere ROLE_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "404":
          description: Videojuego no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"

  # ── USERS ──────────────────────────────────────────────────────────────────
  /api/v1/users:
    get:
      tags: [Users]
      summary: Listar todos los usuarios
      operationId: listUsers
      description: Requiere ROLE_ADMIN.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsuarioResponse"
        "401":
          description: Token ausente o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "403":
          description: Sin permisos — se requiere ROLE_ADMIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"

  # ── RESOURCES ──────────────────────────────────────────────────────────────
  /api/v1/resources:
    get:
      tags: [Resources]
      summary: Recurso protegido de ejemplo
      operationId: getProtectedResource
      description: Endpoint de ejemplo para verificar autenticación. Requiere token válido.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recurso devuelto correctamente
          content:
            text/plain:
              schema:
                type: string
                example: "Recurso protegido OK"
        "401":
          description: Token ausente o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
        "403":
          description: Sin permisos suficientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorDetailsResponse"
